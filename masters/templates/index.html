<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    .overlay { background-color: rgba(255, 255, 255, 0.85); padding: 2rem; border-radius: 8px; }
  </style>
</head>
<body {% if bg_flag %}style="background-image: url('{{ bg_flag }}'); background-size: cover; background-position: center; background-attachment: fixed;"{% endif %}>
  <div class="container my-5 overlay">
    <h1 class="mb-4 text-center">Golf Tournament Leaderboard</h1>
    {% if par_key %}
    <canvas id="toParChart" class="mb-5" height="100"></canvas>
    {% endif %}
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>{% for key in headers %}<th>{{ key.replace('_', ' ').title() }}</th>{% endfor %}</tr>
        </thead>
        <tbody>
          {% for p in players %}
          <tr>{% for key in headers %}<td>{{ p[key] }}</td>{% endfor %}</tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    {% if par_key %}
    const names = {{ players | map(attribute=name_key) | list | tojson }};
    let toParData = {{ players | map(attribute=par_key) | list | tojson }};
    toParData = toParData.map(v => { const n = parseFloat(v.replace('+','')); return isNaN(n) ? 0 : n; });
    new Chart(document.getElementById('toParChart').getContext('2d'), {
      type: 'bar',
      data: { labels: names, datasets: [{ label: 'To Par', data: toParData, backgroundColor: 'rgba(54, 162, 235, 0.6)' }] },
      options: { scales: { y: { beginAtZero: true } } }
    });
    {% endif %}
  </script>
</body>
</html>
